<html lang="ko">

    <meta charset="UTF-8">
    <title>거상 어주(小) 경험치, 금액 및 사냥 계산기</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            box-sizing: border-box;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 6px;
            color: #34495e;
            font-size: 0.9rem;
        }
        /* 입력 라벨 옆에 한글 단위 표시 스타일 */
        .korean-hint {
            font-size: 0.85rem;
            color: #27ae60;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-secondary {
            background-color: #e67e22;
            margin-bottom: 15px;
        }
        .btn-secondary:hover {
            background-color: #d35400;
        }
        .result-box {
            margin-top: 20px;
            background-color: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .result-item:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px dashed #bdc3c7;
            font-weight: bold;
            color: #2c3e50;
        }
        .value {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<script>
  function toggleNavDropdown() {
    const menu = document.getElementById("navDropdownMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  }

  window.addEventListener('click', function(e) {
    const btn = document.querySelector('button[onclick="toggleNavDropdown()"]');
    const menu = document.getElementById("navDropdownMenu");
    if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
      menu.style.display = "none";
    }
  });
</script>

<!-- 1. 기존 어주 계산기 카드 -->
<div class="calculator-card">
    <h2>거상 어주(小) 경험치, 금액 환산 계산기</h2>
    
    <div class="input-group">
        <label for="eojuCount">
            <span>필요한 어주(小) 개수 (개)</span>
            <span class="korean-hint" id="eojuCountHint"></span>
        </label>
        <input type="text" id="eojuCount" value="15,000" placeholder="예: 15,000" oninput="onFormattedInput(this, calculate)">
    </div>

    <div class="input-group">
        <label for="pricePerUnit">어주 15개(300억 경험치)당 가격 (억냥)</label>
        <input type="number" id="pricePerUnit" value="1.75" step="0.01" min="0" placeholder="예: 1.75" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>총 필요 경험치:</span>
            <span class="value" id="totalExp">-</span>
        </div>
        <div class="result-item">
            <span>300억 용병 거래 횟수:</span>
            <span class="value" id="tradeCount">-</span>
        </div>
        <div class="result-item">
            <span>총 비용 (냥):</span>
            <span class="value" id="totalCost">-</span>
        </div>
    </div>
</div>

<!-- 2. 사냥 시간 및 일수 계산기 카드 -->
<div class="calculator-card">
    <h2>사냥 경험치 소요시간 계산기</h2>

    <button class="btn-calc btn-secondary" onclick="importTotalExp()">위 어주 총 경험치 불러오기</button>
    
    <div class="input-group">
        <label for="targetExpEok">
            <span>목표 경험치 (억 단위)</span>
            <span class="korean-hint" id="targetExpEokHint"></span>
        </label>
        <input type="text" id="targetExpEok" value="300,000" placeholder="예: 300,000 (30조)" oninput="onFormattedInput(this, calculateHuntTime, updateTargetExpHint)">
    </div>

    <div class="input-group">
        <label for="expPerHourEok">
            <span>시간당 경치 (억 단위)</span>
            <span class="korean-hint" id="expPerHourEokHint"></span>
        </label>
        <input type="text" id="expPerHourEok" value="300" placeholder="예: 300 (시간당 300억)" oninput="onFormattedInput(this, calculateHuntTime, updateExpPerHourHint)">
    </div>

    <div class="input-group">
        <label for="hoursPerDay">하루 사냥 시간 (시간)</label>
        <input type="number" id="hoursPerDay" value="3" step="0.5" min="0.1" placeholder="예: 3" oninput="calculateHuntTime()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>총 필요한 사냥 시간:</span>
            <span class="value" id="totalHuntHours">-</span>
        </div>
        <div class="result-item">
            <span>예상 소요 일수:</span>
            <span class="value" id="totalHuntDays">-</span>
        </div>
    </div>
</div>

<script>
    let globalTotalExpRaw = 0; // 어주 계산기에서 산출된 순수 경험치 숫자 저장

    function formatNumber(num) {
        return num.toLocaleString('ko-KR');
    }

    // 콤마 제거 후 숫자만 추출
    function parseRawNumber(str) {
        return parseFloat(String(str).replace(/,/g, '')) || 0;
    }

    // 천단위 콤마 자동 서식 처리
    function onFormattedInput(input, callbackCalc, callbackHint) {
        let val = input.value.replace(/[^0-9]/g, ''); // 숫자 외 제거
        if (val) {
            input.value = Number(val).toLocaleString('ko-KR');
        } else {
            input.value = '';
        }

        if (callbackHint) callbackHint();
        if (callbackCalc) callbackCalc();
    }

    // --- 라벨 옆 한글 단위 표시 힌트 업데이트 ---
    function updateTargetExpHint() {
        const eokVal = parseRawNumber(document.getElementById('targetExpEok').value);
        const expRaw = eokVal * 100000000; // 억 -> 순수 경험치
        document.getElementById('targetExpEokHint').innerText = eokVal > 0 ? `(${formatExp(expRaw)})` : '';
    }

    function updateExpPerHourHint() {
        const eokVal = parseRawNumber(document.getElementById('expPerHourEok').value);
        const expRaw = eokVal * 100000000;
        document.getElementById('expPerHourEokHint').innerText = eokVal > 0 ? `(${formatExp(expRaw)})` : '';
    }

    // --- 기존 어주 계산기 함수 ---
    function calculate() {
        const eojuCount = parseRawNumber(document.getElementById('eojuCount').value);
        const pricePerUnitEok = parseFloat(document.getElementById('pricePerUnit').value) || 0;

        const expPerEoju = 2000000000; // 어주 1개당 20억
        const eojuPerTrade = 15;        // 1회 거래당 어주 15개 (300억)

        // 1. 총 필요 경험치
        const totalExp = eojuCount * expPerEoju;
        globalTotalExpRaw = totalExp; // 전역 변수 업데이트

        // 2. 거래 횟수
        const tradeCount = eojuCount / eojuPerTrade;

        // 3. 총 비용 (억냥 -> 냥)
        const pricePerUnit = pricePerUnitEok * 100000000;
        const totalCost = tradeCount * pricePerUnit;

        // 결과 출력
        document.getElementById('totalExp').innerText = formatExp(totalExp);
        document.getElementById('tradeCount').innerText = `${formatNumber(tradeCount)} 회`;
        document.getElementById('totalCost').innerText = formatMoney(totalCost);

        // 하단 사냥 시간 계산기도 동시 업데이트
        calculateHuntTime();
    }

    // 경험치 포맷 변환 (조/억/만 단위 적용)
    function formatExp(exp) {
        if (exp === 0) return '0';

        const joUnit = 1000000000000; // 1조
        const eokUnit = 100000000;    // 1억
        const manUnit = 10000;        // 1만

        const jo = Math.floor(exp / joUnit);
        let remainder = exp % joUnit;

        const eok = Math.floor(remainder / eokUnit);
        remainder = remainder % eokUnit;

        const man = Math.floor(remainder / manUnit);

        let result = '';
        if (jo > 0) result += `${formatNumber(jo)}조 `;
        if (eok > 0) result += `${formatNumber(eok)}억 `;
        if (man > 0) result += `${formatNumber(man)}만 `;
        
        return result.trim();
    }

    // 금액 포맷 변환 (조 / 억 / 만 단위 분리)
    function formatMoney(money) {
        if (money === 0) return '0 냥';

        const joUnit = 1000000000000;
        const eokUnit = 100000000;
        const manUnit = 10000;

        const jo = Math.floor(money / joUnit);
        let remainder = money % joUnit;

        const eok = Math.floor(remainder / eokUnit);
        remainder = remainder % eokUnit;

        const man = Math.floor(remainder / manUnit);

        let result = '';
        if (jo > 0) result += `${formatNumber(jo)}조 `;
        if (eok > 0) result += `${formatNumber(eok)}억 `;
        if (man > 0) result += `${formatNumber(man)}만 `;
        result += '냥';

        return result.trim();
    }

    // --- 사냥 시간 계산 관련 함수 ---
    
    // 위 어주 계산기에서 산출된 총 경험치를 억 단위로 변환해 하단 목표 입력란에 동기화
    function importTotalExp() {
        const targetExpEokInput = document.getElementById('targetExpEok');
        const expInEok = globalTotalExpRaw / 100000000; // 억 단위 변환
        
        targetExpEokInput.value = expInEok.toLocaleString('ko-KR');
        
        updateTargetExpHint();
        calculateHuntTime();
    }

    function calculateHuntTime() {
        const targetExpEok = parseRawNumber(document.getElementById('targetExpEok').value);
        const expPerHourEok = parseRawNumber(document.getElementById('expPerHourEok').value);
        const hoursPerDay = parseFloat(document.getElementById('hoursPerDay').value) || 0;

        if (targetExpEok <= 0 || expPerHourEok <= 0) {
            document.getElementById('totalHuntHours').innerText = '-';
            document.getElementById('totalHuntDays').innerText = '-';
            return;
        }

        // 1. 총 필요 시간 (목표 경치(억) / 시간당 경치(억))
        const totalHours = targetExpEok / expPerHourEok;

        // 2. 소요 일수 (총 필요 시간 / 하루 사냥 시간)
        const totalDays = hoursPerDay > 0 ? (totalHours / hoursPerDay) : 0;

        // 소수점 한 자리까지 표기
        document.getElementById('totalHuntHours').innerText = `${formatNumber(Math.round(totalHours * 10) / 10)} 시간`;
        
        if (hoursPerDay > 0) {
            document.getElementById('totalHuntDays').innerText = `약 ${formatNumber(Math.round(totalDays * 10) / 10)} 일`;
        } else {
            document.getElementById('totalHuntDays').innerText = '하루 사냥 시간을 입력하세요';
        }
    }

    // 페이지 로드 시 자동 실행
    window.onload = function() {
        calculate();
        updateTargetExpHint();
        updateExpPerHourHint();
    };
</script>

</body>
</html>
