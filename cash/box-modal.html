            justify-content: center;

            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
        }

            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: bold;
        }

            width: 80px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: right;
            font-size: 0.9rem;
        }

        .sim-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;

            background-color: var(--accent-color);

            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;

            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #feebc8;
            margin-bottom: 12px;
            font-size: 0.88rem;

            border-radius: 8px;

        .result-box.sub { background-color: #f7fafc; cursor: help; }

        .table-container {

            border: 1px solid var(--border-color);

let cumulativeProbs = [];
function updateCumulativeProbs() {
    cumulativeProbs = [];
    let currentSum = 0;
    items.forEach((item, index) => {
        currentSum += item.prob;
        cumulativeProbs.push({ index, cumulative: currentSum, name: item.name });
    });
}

            const savedPrices = JSON.parse(saved);
            items.forEach(item => {
                if (savedPrices[item.name] !== undefined) {
                    item.price = savedPrices[item.name];
                }
            });
        } catch (e) {
            console.error("저장된 가격 로드 실패:", e);
        }
    }
}

function saveCustomPrices() {
    const priceMap = {};
    items.forEach(item => {
        priceMap[item.name] = item.price;
    });
    localStorage.setItem('chulhee_box_prices', JSON.stringify(priceMap));
    alert('현재 설정된 가격이 저장되었습니다.');
}

function resetToDefaultPrices() {
    if (confirm('기본 가격으로 세팅하고 저장된 가격 데이터를 삭제하시겠습니까?')) {
        localStorage.removeItem('chulhee_box_prices');
        items = JSON.parse(JSON.stringify(defaultItems));
        sortItemsByProb();
        updateCumulativeProbs();
        renderTable();
        calculate();
        updateAllRowVisibility();
        alert('기본 가격으로 세팅되었으며, 저장 데이터가 삭제되었습니다.');
    }
}

function closeBoxModal() {
    window.close();
}

function formatMoney(valueInEok, showSign = false) {
    const isNegative = valueInEok < 0;
    const absValue = Math.abs(valueInEok);
    
    const eok = Math.floor(absValue);
    const man = Math.round((absValue - eok) * 10000);
    
    let result = [];
    if (eok > 0) result.push(`${eok}억`);
    if (man > 0) result.push(`${man.toLocaleString()}만`);
    
    let formattedText = result.length === 0 ? "0 냥" : result.join(' ') + " 냥";
    
    if (isNegative) {
        return `- ${formattedText}`;
    } else if (showSign && valueInEok > 0) {
        return `+ ${formattedText}`;
    }
    return formattedText;
}

// 🎰 시뮬레이터 접기 / 열기 토글
function toggleSimulator() {
    const simCard = document.getElementById('sim-card');
    const toggleBtn = document.querySelector('.btn-toggle-sim');
    
    if (simCard.classList.contains('active')) {
        simCard.classList.remove('active');
        toggleBtn.innerText = '🎰 가상 상자 까기 시뮬레이터 열기';
    } else {
        simCard.classList.add('active');
        toggleBtn.innerText = '🎰 가상 상자 까기 시뮬레이터 닫기';
    }
}

// 🎰 상자 개봉 함수
function openBoxes(count) {
    for (let i = 0; i < count; i++) {
        const rand = Math.random();
        let selectedItem = items[items.length - 1];

        for (let target of cumulativeProbs) {
            if (rand <= target.cumulative) {
                selectedItem = items[target.index];
                break;
            }
        }
        
        // 누적 획득 수량 계산
        simObtainedCounts[selectedItem.name] = (simObtainedCounts[selectedItem.name] || 0) + 1;

        simTotalOpened++;
        simTotalValueInEok += selectedItem.price;
    }

    updateSimUI();
}

// 시뮬레이터 UI 갱신
function updateSimUI() {
    const singleBuyPrice = parseFloat(document.getElementById('sim-box-buy-price').value) || 0;
    const totalCost = simTotalOpened * singleBuyPrice;
    const netProfit = simTotalValueInEok - totalCost;

    document.getElementById('sim-total-count').innerText = `${simTotalOpened.toLocaleString()} 개`;
    document.getElementById('sim-total-cost').innerText = formatMoney(totalCost);
    document.getElementById('sim-total-value').innerText = formatMoney(simTotalValueInEok);
    
    // 손익 금액 엘리먼트 & 색상 설정
    const profitEl = document.getElementById('sim-net-profit');
    profitEl.innerText = formatMoney(netProfit, true);
    profitEl.className = '';
    
    if (netProfit > 0) {
        profitEl.classList.add('color-profit');
    } else if (netProfit < 0) {
        profitEl.classList.add('color-loss');
    }

    // 누적 획득 결과 테이블 출력
    renderCumulativeTable();
}

// 누적 결과물 정렬 및 출력 함수
function renderCumulativeTable() {
    const tbody = document.getElementById('sim-cumulative-tbody');
    
    const obtainedList = Object.keys(simObtainedCounts).map(itemName => {
        const itemObj = items.find(i => i.name === itemName) || { price: 0, prob: 1 };
        return {
            name: itemName,
            count: simObtainedCounts[itemName],
            price: itemObj.price,
            prob: itemObj.prob,
            totalValue: itemObj.price * simObtainedCounts[itemName]
        };
    });

    if (obtainedList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #a0aec0; padding: 15px;">개봉된 누적 아이템이 없습니다.</td></tr>`;
        return;
    }

    // 정렬 로직: 
    // 1. 가격(단가) 비싼 순 (내림차순)
    // 2. 가격이 같으면 확률 낮은 순 (오름차순)
    obtainedList.sort((a, b) => {
        if (b.price !== a.price) {
            return b.price - a.price;
        }
        return a.prob - b.prob;
    });

    let html = '';
    obtainedList.forEach(item => {
        const isJackpot = item.prob < 0.001;
        const rowClass = isJackpot ? 'jackpot-row' : '';
        const jackpotIcon = isJackpot ? '✨ ' : '';

        html += `
            <tr class="${rowClass}">
                <td>${jackpotIcon}${item.name}</td>
                <td>${formatMoney(item.price)}</td>
                <td><strong>${item.count.toLocaleString()} 개</strong></td>
                <td>${formatMoney(item.totalValue)}</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

function updateSimUIOnly() {
    if (simTotalOpened > 0) {
        updateSimUI();
    }
}

function resetSimData() {
    simTotalOpened = 0;
    simTotalValueInEok = 0;
    simObtainedCounts = {};
    
    document.getElementById('sim-total-count').innerText = '0 개';
    document.getElementById('sim-total-cost').innerText = '0 냥';
    document.getElementById('sim-total-value').innerText = '0 냥';
    
    const profitEl = document.getElementById('sim-net-profit');
    profitEl.innerText = '0 냥';
    profitEl.className = '';
    
    document.getElementById('sim-cumulative-tbody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #a0aec0; padding: 15px;">개봉된 누적 아이템이 없습니다.</td></tr>';
}

function sortItemsByProb() {
    items.sort((a, b) => probSortDesc ? b.prob - a.prob : a.prob - b.prob);
}

function renderTable() {
    const tbody = document.getElementById('item-table-body');
    tbody.innerHTML = '';

    items.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        
        const probPercent = (item.prob * 100).toFixed(4) + '%';
        const expectedBoxes = Math.round(1 / item.prob).toLocaleString() + '개';

        const isUntradeable = item.untradeable || item.name.includes('거래불가') || item.name.includes('귀속');
        const textClass = isUntradeable ? 'text-untradeable' : '';
        const readonlyAttr = isUntradeable ? 'readonly' : '';
        const titleText = isUntradeable ? '더블클릭 시 가격 수정 가능' : '';

        tr.innerHTML = `
            <td><strong class="${textClass}">${item.name}</strong></td>
            <td>${probPercent}</td>
            <td style="color: #4a5568; font-weight: 500;">약 ${expectedBoxes}</td>
            <td>
                <input type="number" 
                       class="input-price ${textClass}" 
                       value="${item.price}" 
                       step="0.01" 
                       min="0" 
                       ${readonlyAttr}
                       title="${titleText}"
                       data-index="${index}">
                <span class="unit">억</span>
            </td>
            <td id="expected-${index}">0 냥</td>
        `;
        tbody.appendChild(tr);
    });

    document.querySelectorAll('.input-price').forEach(input => {
        input.addEventListener('input', (e) => {
            const idx = e.target.dataset.index;
            items[idx].price = parseFloat(e.target.value) || 0;
            calculate();
            updateRowVisibility(idx);
            if (simTotalOpened > 0) updateSimUI();
        });

        input.addEventListener('dblclick', (e) => {
            if (e.target.hasAttribute('readonly')) {
                e.target.removeAttribute('readonly');
                e.target.style.backgroundColor = '#ffffff';
                e.target.select();
            }
        });
    });
}

function calculate() {
    let totalExpectedInEok = 0;
    let realisticExpectedInEok = 0;

    items.forEach((item, index) => {
        const expectedValue = item.prob * item.price;
        totalExpectedInEok += expectedValue;

        if (item.prob >= 0.001) {
            realisticExpectedInEok += expectedValue;
        }

        const cell = document.getElementById(`expected-${index}`);
        if (cell) cell.innerText = formatMoney(expectedValue);
    });

    document.getElementById('total-expected').innerText = formatMoney(totalExpectedInEok);
    document.getElementById('realistic-expected').innerText = formatMoney(realisticExpectedInEok);
}

function updateAllRowVisibility() {
    items.forEach((item, index) => updateRowVisibility(index));
}

function updateRowVisibility(index) {
    const row = document.getElementById(`row-${index}`);
    if (!row) return;

    if (hideZeroPrice && items[index].price === 0) {
        row.classList.add('row-hidden');
    } else {
        row.classList.remove('row-hidden');
    }
}

function toggleHideZeroPrice() {
    hideZeroPrice = !hideZeroPrice;
    const btn = document.getElementById('btn-toggle-zero');
    btn.innerText = hideZeroPrice ? "🙈" : "👁️";
    btn.title = hideZeroPrice ? "0원 항목 표시하기" : "0원 항목 숨기기";
    updateAllRowVisibility();
}

// 확률 헤더 클릭 이벤트 (오름차순/내림차순 토글 정렬)
document.getElementById('header-prob').addEventListener('click', () => {
    probSortDesc = !probSortDesc;
    document.getElementById('prob-sort-icon').innerText = probSortDesc ? "▼" : "▲";
    sortItemsByProb();
    updateCumulativeProbs();
    renderTable();
    calculate();
    updateAllRowVisibility();
});

// 가격 입력 헤더 및 눈 아이콘 버튼 클릭 이벤트
document.getElementById('header-price').addEventListener('click', () => {
    toggleHideZeroPrice();
});

document.getElementById('btn-toggle-zero').addEventListener('click', (e) => {
    e.stopPropagation(); // 헤더 중복 이벤트 발생 방지
    toggleHideZeroPrice();
});

document.getElementById('box-modal').addEventListener('click', function(e) {
    if (e.target === this) closeBoxModal();
});

// 초기화
loadSavedPrices();
sortItemsByProb();
updateCumulativeProbs();
renderTable();
calculate();
</script>
</body>
