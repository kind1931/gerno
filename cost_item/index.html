<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XT7WN5EW7B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XT7WN5EW7B');
  </script>
  <!-- 공통 네비게이션 스크립트 불러오기 -->
  <script src="/nav.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰아이템 제작 비용 계산기</title>
  <script src="recipes.js" defer></script>
  <style>
    :root {
      --bg-simple: #e8f5e9;
      --bg-crafted: #fffde7;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2b3a4a;
      --accent: #2563eb;
      --border: #cbd5e1;
      --light-blue: #e0f2fe;
      --highlight: #dbeafe;
      --danger: #ef4444;
      --success: #10b981;
      --star-active: #f59e0b;
      --star-inactive: #cbd5e1;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 { margin-bottom: 10px; }

    /* 상단 고정 컨테이너: Flex 적용으로 탭과 우측 도구를 한 줄로 배치 */
    .sticky-header-container {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #f8f9fa;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end; /* 탭 버튼 바닥선과 높이 맞춤 */
      border-bottom: 2px solid #007bff; /* 탭과 라인 자연스럽게 연결 */
    }

    .tab-buttons {
      display: flex;
      gap: 5px;
      margin-bottom: 0;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-bottom: none; /* 하단 테두리를 없애 연결감 부여 */
      background: #e0e0e0;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px 5px 0 0;
    }

    .tab-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    /* 탭 우측 끝에 붙는 도구 박스 */
    .top-compact-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 5px; /* 탭 라인 수직 위치 맞춤 조정 */
      background: #fff;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    
    .tab-content {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 0 5px 5px 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tab-content.active { display: block; }
    
    /* 필터 및 검색 레이아웃 */
    .filter-section {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 5px 12px;
      border: 1px solid #007bff;
      background: #fff;
      color: #007bff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      transition: all 0.2s;
    }
    .filter-btn.active { background: #007bff; color: white; }
    .filter-btn:disabled, button:disabled, input:disabled {
      background: #e9ecef !important;
      color: #adb5bd !important;
      border-color: #ced4da !important;
      cursor: not-allowed !important;
      opacity: 0.7;
    }
    label.disabled-label {
      color: #adb5bd !important;
      cursor: not-allowed !important;
    }

    /* 검색 UI 스타일 */
    .search-box-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.9em;
    }
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #007bff;
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 0 0 4px 4px;
      display: none;
    }
    .suggestion-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.88em;
    }
    .suggestion-item:hover, .suggestion-item.active-item {
      background-color: #eef7ff;
    }

    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .tag {
      background: #007bff;
      color: white;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.85em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tag-close {
      cursor: pointer;
      font-weight: bold;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.3);
    }
    .tag-close:hover { background: rgba(255,255,255,0.6); }

    /* 즐겨찾기 별 버튼 */
    .star-btn { cursor: pointer; color: #ccc; font-size: 1.2em; user-select: none; margin-right: 4px; }
    .star-btn.active { color: #fbc02d; }

    /* 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    
    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 105px;
      z-index: 90;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    th.clickable-header {
      cursor: pointer;
      user-select: none;
    }
    th.clickable-header:hover { background-color: #e2e2e2; }
    th.disabled-header {
      cursor: not-allowed !important;
      opacity: 0.7;
    }
    
    .bg-simple { background-color: var(--bg-simple) !important; }
    .bg-crafted { background-color: var(--bg-crafted) !important; }

    input[type="number"] { padding: 6px; width: 110px; border: 1px solid #ccc; border-radius: 4px; }
    .sub-table { margin-top: 8px; background: #fafafa; }
    
    .badge { display: inline-block; padding: 3px 7px; font-size: 0.8em; border-radius: 3px; font-weight: bold; }
    .badge-simple { background: #c8e6c9; color: #2e7d32; }
    .badge-crafted { background: #fff9c4; color: #f57f17; }
    
    .price-type-toggle { font-size: 0.85em; margin-top: 4px; }
    .result-box { margin-top: 20px; padding: 15px; background: #eef7ff; border-left: 5px solid #007bff; }

    .qty-item-card {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #fff;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      max-width: 450px;
    }

    /* 토스트 스타일 */
    #toastContainer { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 200px; padding: 12px 20px; background: #323232; color: #fff; border-radius: 6px; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-success { background: #2e7d32; }
    .toast-info { background: #2196f3; }
    .toast-warn { background: #f57c00; }

    .btn {
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      color: white;
    }

    .btn:hover { opacity: 0.9; }
    .btn-save { background-color: var(--accent); }
    .btn-reset { background-color: #f97316; }
    .btn-clear-all { background-color: var(--danger); }
    .btn-delete { background-color: #64748b; }
    .btn-toggle { background-color: #8b5cf6; }
    
  </style>
</head>
<body>

  <h1>💰아이템 제작 비용 계산기</h1>

  <div class="sticky-header-container">
    <div class="tab-buttons">
      <button id="tabBtn-costTab" class="tab-btn active" onclick="switchTab('costTab', this)">제작 비용</button>
      <button id="tabBtn-quantityTab" class="tab-btn" onclick="switchTab('quantityTab', this)">제작 수량</button>
    </div>

    <!-- 탭 우측 끝에 위치할 compact 저장 도구 모음 -->
    <div class="top-compact-tools">
      <label style="cursor:pointer; font-size: 0.85em;"><input type="checkbox" id="autoSaveToggle"> 자동 저장</label>
      <button onclick="saveToLocalStorage()" class="btn btn-save" >저장</button>
      <button onclick="clearLocalStorage()" class="btn btn-clear-all" >데이터초기화</button>
    </div>
  </div>

  <!-- 탭 1: 제작 비용 -->
  <div id="costTab" class="tab-content active">
    <h3>주요 품목 제작 비용 계산 (단위: 만냥)</h3>
    
    <div class="filter-section">
      <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div>
          <span style="font-size:0.85em; font-weight:bold; color:#555; margin-right:6px;">분류 필터:</span>
          <span id="categoryFilterContainer" class="filter-group" style="display:inline-flex;"></span>
        </div>
        <div style="border-left: 1px solid #ccc; padding-left: 15px; display: flex; gap: 10px; align-items: center;">
          <button id="favOnlyBtn" class="filter-btn" onclick="toggleFavoriteFilter()">★ 즐겨찾기만 보기</button>
          <label id="favIncludeSubLabel" style="font-size:0.85em; cursor:pointer;">
            <input type="checkbox" id="favIncludeSubToggle" checked onchange="renderCostTable()"> 즐겨찾기 하위재료 포함
          </label>
        </div>
      </div>

      <!-- 공통 검색 영역 (비용 탭) -->
      <div class="search-box-container">
        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
          <div class="search-input-wrapper">
            <input type="text" id="costSearchInput" class="search-input" placeholder="품목 검색 (방향키/Enter 선택 가능)" oninput="handleSearchInput('costSearchInput', 'costSuggestionsList', this.value)" onkeydown="handleSearchKeyDown(event, 'costSearchInput', 'costSuggestionsList')">
            <div id="costSuggestionsList" class="suggestions-list"></div>
          </div>
          <label style="font-size:0.85em; cursor:pointer;">
            <input type="checkbox" id="searchIncludeSubToggle" checked onchange="renderCostTable()"> 검색 아이템의 하위재료 함께 보기
          </label>
        </div>
        <div id="costSelectedTagsContainer" class="selected-tags"></div>
      </div>
    </div>

    <table id="costTable">
      <thead>
        <tr>
          <th id="thFavoriteHeader" class="clickable-header" onclick="toggleFavoriteFilter()" title="클릭 시 즐겨찾기 품목만 필터링합니다.">
            품목명
          </th>
          <th>1회 제작수량</th>
          <th>필요 재료 및 가격</th>
          <th>1회 총 제작비용</th>
          <th>개당 제작비용</th>
          <th>개당 구매가격</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 탭 2: 제작 수량 -->
  <div id="quantityTab" class="tab-content">
    <h3>제작 필요 재료 및 비용 산출 (다중 항목 합산)</h3>
    <div style="margin-bottom: 15px;">
      
      <div class="filter-section">
        <!-- 공통 검색 영역 (수량 탭) -->
        <div class="search-box-container">
          <div class="search-input-wrapper">
            <input type="text" id="qtySearchInput" class="search-input" placeholder="수량 계산 품목 추가 검색 (방향키/Enter 가능)" oninput="handleSearchInput('qtySearchInput', 'qtySuggestionsList', this.value)" onkeydown="handleSearchKeyDown(event, 'qtySearchInput', 'qtySuggestionsList')">
            <div id="qtySuggestionsList" class="suggestions-list"></div>
          </div>
          <div id="qtySelectedTagsContainer" class="selected-tags"></div>
        </div>
      </div>

      <!-- 선택된 품목 목표 수량 조절 -->
      <div id="qtyTargetItemsContainer" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;"></div>
      
      <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
        <span style="font-weight: bold; font-size: 0.9em; color: #444; margin-bottom: 4px;">🔍 조회 방식 선택:</span>
        <label style="font-weight: bold; color: #2e7d32; cursor: pointer;">
          <input type="radio" name="decomposeMode" value="default" id="modeDefault" checked onchange="onModeRadioChange('default')"> 기본보기 (직속 재료만 표시)
        </label>
        <label style="font-weight: bold; color: #2563eb; cursor: pointer;">
          <input type="radio" name="decomposeMode" value="buyFollow" id="modeBuyFollow" onchange="onModeRadioChange('buyFollow')"> 구매가 추종이 없는 품목만 최하위 재료로 분해하여 보기
        </label>
        <label style="font-weight: bold; color: #d32f2f; cursor: pointer;">
          <input type="radio" name="decomposeMode" value="flat" id="modeFlat" onchange="onModeRadioChange('flat')"> 모든 품목 최하위 재료로 일괄 분해하여 보기
        </label>
      </div>
    </div>

    <div id="quantityResult" class="result-box"></div>
  </div>

  <div id="toastContainer"></div>

  <script>
    let recipes = [];
    let priceStore = {};
    let favorites = new Set();
    let selectedJobs = new Set();
    
    let selectedSearchItems = new Set();
    let qtyTargetItems = {}; // { '품목명': 수량 }
    let expandedCraftItems = new Set(); // 결과 목록에서 사용자가 개별 분해 체크한 제작품 세트

    let currentDecomposeMode = 'default'; // 'default', 'buyFollow', 'flat', 'custom'

    let showFavOnly = false;
    let autoSave = false;
    let activeSuggestionIndex = -1;

    const STORAGE_KEY = 'craft_calculator_prices_v6';
    const FAV_STORAGE_KEY = 'craft_calculator_favs_v6';
    const SEARCH_STORAGE_KEY = 'craft_calculator_search_v6';
    const TAB_STORAGE_KEY = 'craft_calculator_active_tab_v6';

    /* 금액 단위 단위 표현 포맷터 (만냥 단위 기준) */
    function formatCurrency(valInTenThousand) {
      if (valInTenThousand === 0 || isNaN(valInTenThousand)) return "0 만냥";
      
      let rawNyang = BigInt(Math.floor(valInTenThousand * 10000));
      if (rawNyang === 0n) {
        return `${Number(valInTenThousand.toFixed(4)).toLocaleString()} 만냥`;
      }

      const JO = 1000000000000n; // 1조 냥
      const EOK = 100000000n;    // 1억 냥
      const MAN = 10000n;       // 1만 냥

      let result = [];
      
      let jo = rawNyang / JO;
      rawNyang %= JO;
      
      let eok = rawNyang / EOK;
      rawNyang %= EOK;
      
      let man = rawNyang / MAN;
      let restNyang = rawNyang % MAN;

      if (jo > 0n) result.push(`${jo.toLocaleString()}조`);
      if (eok > 0n) result.push(`${eok.toLocaleString()}억`);
      if (man > 0n) result.push(`${man.toLocaleString()}만`);

      if (result.length === 0) {
        return `${restNyang.toLocaleString()}냥`;
      }
      
      return `${result.join(' ')} 만냥`;
    }

    function showToast(message, type = 'success', duration = 2500) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => container.contains(toast) && container.removeChild(toast), 300);
      }, duration);
    }

    function getItemName(item) {
      return item?.item_name || item?.name || item?.itemName || '이름없음';
    }

    function getItemCraftCount(item) {
      const raw = item?.yield ?? item?.crafting_yield ?? item?.craftCount ?? item?.count ?? 1;
      return parseFloat(raw) || 1;
    }

    function getIngCount(ing) {
      const raw = ing?.quantity ?? ing?.count ?? ing?.amount ?? 1;
      return parseFloat(raw) || 1;
    }

    function getItemFee(item) {
      const raw = item?.crafting_fee ?? item?.fee ?? 0;
      if (typeof raw === 'number') return raw >= 1000 ? raw / 10000 : raw;
      const match = String(raw).replace(/,/g, '').match(/([\d.]+)\s*([만천])?/);
      if (!match) return 0;
      const num = parseFloat(match[1]);
      return match[2] === '만' ? num : match[2] === '천' ? num * 0.1 : (num >= 1000 ? num / 10000 : num);
    }

    function normalizeStr(str) {
      return String(str || '').replace(/\s+/g, '').toLowerCase();
    }

    function getAllSubIngredients(itemName, visited = new Set()) {
      if (visited.has(itemName)) return visited;
      visited.add(itemName);
      const recipe = recipes.find(r => getItemName(r) === itemName);
      if (recipe && recipe.ingredients) {
        recipe.ingredients.forEach(ing => {
          getAllSubIngredients(getItemName(ing), visited);
        });
      }
      return visited;
    }

    function getItemDepthMap(searchRoots) {
      const depthMap = new Map();
      function traverse(itemName, currentDepth) {
        if (!depthMap.has(itemName) || currentDepth < depthMap.get(itemName)) {
          depthMap.set(itemName, currentDepth);
        }
        const recipe = recipes.find(r => getItemName(r) === itemName);
        if (recipe && recipe.ingredients) {
          recipe.ingredients.forEach(ing => {
            traverse(getItemName(ing), currentDepth + 1);
          });
        }
      }
      searchRoots.forEach(root => traverse(root, 0));
      return depthMap;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();

      if (typeof defaultRecipes !== 'undefined' && Array.isArray(defaultRecipes)) {
        recipes = defaultRecipes;
        initPriceStore();
        renderCategoryFilters();
        renderAllSearchTags();
        
        // 새로고침 시 저장된 탭으로 활성화
        const savedTab = localStorage.getItem(TAB_STORAGE_KEY) || 'costTab';
        const targetBtn = document.getElementById(`tabBtn-${savedTab}`);
        if (targetBtn) {
          switchTab(savedTab, targetBtn);
        } else {
          renderCostTable();
          renderQtyTargetRows();
        }
      } else {
        showToast('recipes.js 데이터 로드에 실패했습니다.', 'warn', 4000);
      }

      document.getElementById('autoSaveToggle').addEventListener('change', (e) => {
        autoSave = e.target.checked;
        if (autoSave) showToast('자동 저장이 활성화되었습니다.', 'info');
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-input-wrapper')) {
          document.querySelectorAll('.suggestions-list').forEach(el => el.style.display = 'none');
        }
      });
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (btn) btn.classList.add('active');

      localStorage.setItem(TAB_STORAGE_KEY, tabId);

      if (tabId === 'costTab') {
        renderCostTable();
      } else if (tabId === 'quantityTab') {
        renderQtyTargetRows();
      }
    }

    function renderCategoryFilters() {
      const container = document.getElementById('categoryFilterContainer');
      if (!container) return;
      
      const jobs = [...new Set(recipes.map(r => r.job).filter(Boolean))];
      container.innerHTML = '';

      jobs.forEach(job => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${selectedJobs.has(job) ? 'active' : ''}`;
        btn.textContent = job;
        btn.onclick = () => {
          if (selectedJobs.has(job)) {
            selectedJobs.delete(job);
            btn.classList.remove('active');
          } else {
            selectedJobs.add(job);
            btn.classList.add('active');
          }
          renderCostTable();
        };
        container.appendChild(btn);
      });

      updateCategoryFilterState();
    }

    function updateCategoryFilterState() {
      const container = document.getElementById('categoryFilterContainer');
      const isSearching = selectedSearchItems.size > 0;

      if (container) {
        const buttons = container.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
          btn.disabled = isSearching;
          if (isSearching) btn.title = '품목 검색 중에는 분류 필터가 비활성화됩니다.';
          else btn.removeAttribute('title');
        });
      }

      const favOnlyBtn = document.getElementById('favOnlyBtn');
      if (favOnlyBtn) {
        favOnlyBtn.disabled = isSearching;
        if (isSearching) favOnlyBtn.title = '품목 검색 중에는 즐겨찾기 필터가 비활성화됩니다.';
        else favOnlyBtn.removeAttribute('title');
      }

      const favIncludeSubToggle = document.getElementById('favIncludeSubToggle');
      const favIncludeSubLabel = document.getElementById('favIncludeSubLabel');
      if (favIncludeSubToggle) {
        favIncludeSubToggle.disabled = isSearching;
      }
      if (favIncludeSubLabel) {
        if (isSearching) {
          favIncludeSubLabel.classList.add('disabled-label');
          favIncludeSubLabel.title = '품목 검색 중에는 즐겨찾기 옵션이 비활성화됩니다.';
        } else {
          favIncludeSubLabel.classList.remove('disabled-label');
          favIncludeSubLabel.removeAttribute('title');
        }
      }

      const thFav = document.getElementById('thFavoriteHeader');
      if (thFav) {
        if (isSearching) {
          thFav.classList.add('disabled-header');
          thFav.onclick = null;
          thFav.title = '품목 검색 중에는 즐겨찾기 필터를 이용할 수 없습니다.';
        } else {
          thFav.classList.remove('disabled-header');
          thFav.onclick = toggleFavoriteFilter;
          thFav.title = '클릭 시 즐겨찾기 품목만 필터링합니다.';
        }
      }
    }

    function toggleFavorite(itemName) {
      if (favorites.has(itemName)) favorites.delete(itemName);
      else favorites.add(itemName);
      localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify([...favorites]));
      renderCostTable();
      calculateMultiQuantity();
    }

    function toggleFavoriteFilter() {
      if (selectedSearchItems.size > 0) return;
      showFavOnly = !showFavOnly;
      const favBtn = document.getElementById('favOnlyBtn');
      if (favBtn) {
        if (showFavOnly) favBtn.classList.add('active');
        else favBtn.classList.remove('active');
      }
      renderCostTable();
    }

    function handleSearchInput(inputId, listId, query) {
      const listContainer = document.getElementById(listId);
      const normQuery = normalizeStr(query);
      activeSuggestionIndex = -1;

      if (!normQuery) {
        listContainer.style.display = 'none';
        return;
      }

      const matches = recipes.filter(r => normalizeStr(getItemName(r)).includes(normQuery));
      if (matches.length === 0) {
        listContainer.style.display = 'none';
        return;
      }

      listContainer.innerHTML = '';
      matches.slice(0, 15).forEach((m, idx) => {
        const name = getItemName(m);
        const itemDiv = document.createElement('div');
        itemDiv.className = 'suggestion-item';
        itemDiv.dataset.index = idx;
        itemDiv.textContent = `${name} ${m.job ? `[${m.job}]` : ''}`;
        itemDiv.onclick = () => selectSearchItem(name, inputId, listId);
        listContainer.appendChild(itemDiv);
      });
      listContainer.style.display = 'block';
    }

    function handleSearchKeyDown(event, inputId, listId) {
      const listContainer = document.getElementById(listId);
      const items = listContainer.querySelectorAll('.suggestion-item');
      if (listContainer.style.display === 'none' || items.length === 0) return;

      if (event.key === 'ArrowDown') {
        event.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
        updateActiveSuggestion(items);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
        updateActiveSuggestion(items);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (activeSuggestionIndex >= 0 && activeSuggestionIndex < items.length) {
          items[activeSuggestionIndex].click();
        } else if (items.length > 0) {
          items[0].click();
        }
      }
    }

    function updateActiveSuggestion(items) {
      items.forEach((item, idx) => {
        if (idx === activeSuggestionIndex) {
          item.classList.add('active-item');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('active-item');
        }
      });
    }

    function selectSearchItem(itemName, inputId, listId) {
      addSearchItem(itemName);
      document.getElementById(inputId).value = '';
      document.getElementById(listId).style.display = 'none';
    }

    function addSearchItem(itemName) {
      selectedSearchItems.add(itemName);
      if (!qtyTargetItems[itemName]) qtyTargetItems[itemName] = 1;
      renderAllSearchTags();
      renderCostTable();
      renderQtyTargetRows();
      if (autoSave) saveToLocalStorage(true);
    }

    function removeSearchItem(itemName) {
      selectedSearchItems.delete(itemName);
      delete qtyTargetItems[itemName];
      renderAllSearchTags();
      renderCostTable();
      renderQtyTargetRows();
      if (autoSave) saveToLocalStorage(true);
    }

    function renderAllSearchTags() {
      ['costSelectedTagsContainer', 'qtySelectedTagsContainer'].forEach(containerId => {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        selectedSearchItems.forEach(name => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.innerHTML = `${name} <span class="tag-close" onclick="removeSearchItem('${name}')">&times;</span>`;
          container.appendChild(tag);
        });
      });
    }

    function initPriceStore() {
      recipes.forEach(r => {
        const name = getItemName(r);
        if (!priceStore[name]) priceStore[name] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
        (r.ingredients || []).forEach(ing => {
          const ingName = getItemName(ing);
          if (!priceStore[ingName]) priceStore[ingName] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
        });
      });
    }

    function updatePrice(itemName, field, value) {
      if (!priceStore[itemName]) priceStore[itemName] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
      if (field === 'useBuyPrice') {
        priceStore[itemName].useBuyPrice = value;
        renderCostTable();
      } else {
        priceStore[itemName][field] = parseFloat(value) || 0;
        updateCalculatedUI();
      }
      if (autoSave) saveToLocalStorage(true);
    }

    function getEffectivePrice(itemName) {
      const itemData = priceStore[itemName];
      if (!itemData) return 0;
      if (itemData.useBuyPrice) return itemData.buyPrice;

      const recipe = recipes.find(r => getItemName(r) === itemName);
      if (recipe) {
        let totalCost = getItemFee(recipe);
        const minCraft = getItemCraftCount(recipe);
        (recipe.ingredients || []).forEach(ing => {
          totalCost += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        return minCraft > 0 ? (totalCost / minCraft) : 0;
      }
      return itemData.basePrice;
    }

    function updateCalculatedUI() {
      document.querySelectorAll('[data-applied-price]').forEach(el => {
        const ingName = el.getAttribute('data-applied-price');
        el.textContent = `적용가: ${formatCurrency(getEffectivePrice(ingName))}`;
      });

      recipes.filter(r => r.isMainItem !== false).forEach(item => {
        const name = getItemName(item);
        const minCraft = getItemCraftCount(item);
        let craftCostPerBatch = getItemFee(item);
        (item.ingredients || []).forEach(ing => {
          craftCostPerBatch += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        const unitCraftCost = minCraft > 0 ? craftCostPerBatch / minCraft : 0;
        if (priceStore[name]) priceStore[name].basePrice = unitCraftCost;

        const safeId = encodeURIComponent(name);
        const totalCell = document.getElementById(`total-cost-${safeId}`);
        const unitCell = document.getElementById(`unit-cost-${safeId}`);
        if (totalCell) totalCell.textContent = formatCurrency(craftCostPerBatch);
        if (unitCell) unitCell.innerHTML = `<b>${formatCurrency(unitCraftCost)}</b>`;
      });
      
      calculateMultiQuantity();
    }

    function renderCostTable() {
      updateCategoryFilterState();

      const tbody = document.querySelector('#costTable tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      let filtered = recipes.filter(r => r.isMainItem !== false);

      const searchIncludeSub = document.getElementById('searchIncludeSubToggle')?.checked ?? true;
      let targetSearchSet = new Set();
      if (selectedSearchItems.size > 0) {
        selectedSearchItems.forEach(item => {
          if (searchIncludeSub) {
            getAllSubIngredients(item).forEach(sub => targetSearchSet.add(sub));
          } else {
            targetSearchSet.add(item);
          }
        });
      }

      if (selectedSearchItems.size === 0 && selectedJobs.size === 0 && !showFavOnly) {
        return;
      }

      if (selectedSearchItems.size > 0) {
        filtered = filtered.filter(r => targetSearchSet.has(getItemName(r)));
      } else {
        if (selectedJobs.size > 0) {
          filtered = filtered.filter(r => selectedJobs.has(r.job));
        }

        const favIncludeSub = document.getElementById('favIncludeSubToggle')?.checked ?? true;
        if (showFavOnly) {
          let targetFavSet = new Set();
          favorites.forEach(favItem => {
            if (favIncludeSub) {
              getAllSubIngredients(favItem).forEach(sub => targetFavSet.add(sub));
            } else {
              targetFavSet.add(favItem);
            }
          });
          filtered = filtered.filter(r => targetFavSet.has(getItemName(r)));
        }
      }

      const depthMap = getItemDepthMap([...selectedSearchItems]);

      filtered.sort((a, b) => {
        const aName = getItemName(a);
        const bName = getItemName(b);

        if (selectedSearchItems.size > 0) {
          const aInSearch = targetSearchSet.has(aName) ? 1 : 0;
          const bInSearch = targetSearchSet.has(bName) ? 1 : 0;
          if (aInSearch !== bInSearch) return bInSearch - aInSearch;

          const aDepth = depthMap.has(aName) ? depthMap.get(aName) : 999;
          const bDepth = depthMap.has(bName) ? depthMap.get(bName) : 999;
          if (aDepth !== bDepth) return aDepth - bDepth;
        }

        const aFav = favorites.has(aName) ? 1 : 0;
        const bFav = favorites.has(bName) ? 1 : 0;
        if (aFav !== bFav) return bFav - aFav;

        return aName.localeCompare(bName);
      });

      filtered.forEach(item => {
        const name = getItemName(item);
        const minCraft = getItemCraftCount(item);
        const fee = getItemFee(item);
        const safeId = encodeURIComponent(name);
        const isFav = favorites.has(name);
        const tr = document.createElement('tr');
        
        let craftCostPerBatch = fee;
        (item.ingredients || []).forEach(ing => {
          craftCostPerBatch += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        const unitCraftCost = minCraft > 0 ? craftCostPerBatch / minCraft : 0;
        if (priceStore[name]) priceStore[name].basePrice = unitCraftCost;

        const storeData = priceStore[name] || { buyPrice: 0, useBuyPrice: false };

        let ingRows = (item.ingredients || []).map(ing => {
          const ingName = getItemName(ing);
          const ingCount = getIngCount(ing);
          const isCrafted = recipes.some(r => getItemName(r) === ingName);
          const ingPrice = getEffectivePrice(ingName);
          const ingStore = priceStore[ingName] || { buyPrice: 0, useBuyPrice: false };

          return `
            <tr class="${isCrafted ? 'bg-crafted' : 'bg-simple'}">
              <td>
                <span class="badge ${isCrafted ? 'badge-crafted' : 'badge-simple'}">${isCrafted ? '제작' : '재료'}</span>
                <b>${ingName}</b> (${ingCount}개)
              </td>
              <td>
                ${isCrafted ? `
                  <span data-applied-price="${ingName}">적용가: ${formatCurrency(ingPrice)}</span>
                  <div class="price-type-toggle">
                    <label><input type="checkbox" ${ingStore.useBuyPrice ? 'checked' : ''} onchange="updatePrice('${ingName}', 'useBuyPrice', this.checked)"> 구매가 추종</label>
                  </div>
                ` : `
                  <input type="number" step="any" value="${ingStore.basePrice || ''}" placeholder="가격 입력" oninput="updatePrice('${ingName}', 'basePrice', this.value)"> 만냥

                `}
                ${ingStore.useBuyPrice ? `<br><input type="number" step="any" style="margin-top:4px;" value="${ingStore.buyPrice || ''}" placeholder="구매가 입력" oninput="updatePrice('${ingName}', 'buyPrice', this.value)"> 만냥` : ''}
              </td>
            </tr>
          `;
        }).join('');

        tr.innerHTML = `
          <td class="bg-crafted">
            <span class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${name}')">★</span>
            <b>${name}</b>
            ${item.job ? `<br><small style="color:#666;">[${item.job}]</small>` : ''}
          </td>
          <td><b>${minCraft}개</b></td>
          <td><table class="sub-table" style="width:100%;">${ingRows}</table></td>
          <td id="total-cost-${safeId}">${formatCurrency(craftCostPerBatch)}</td>
          <td id="unit-cost-${safeId}"><b>${formatCurrency(unitCraftCost)}</b></td>
          <td>
            <input type="number" step="any" value="${storeData.buyPrice || ''}" placeholder="구매가격" ${!storeData.useBuyPrice ? 'disabled' : ''} oninput="updatePrice('${name}', 'buyPrice', this.value)"> 만냥
            <div class="price-type-toggle">
              <label><input type="checkbox" ${storeData.useBuyPrice ? 'checked' : ''} onchange="updatePrice('${name}', 'useBuyPrice', this.checked)"> 구매가 추종</label>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateQtyTargetItem(name, qty) {
      qtyTargetItems[name] = parseInt(qty) || 1;
      calculateMultiQuantity();
      if (autoSave) saveToLocalStorage(true);
    }

    function renderQtyTargetRows() {
      const container = document.getElementById('qtyTargetItemsContainer');
      if (!container) return;
      container.innerHTML = '';

      selectedSearchItems.forEach(name => {
        if (!qtyTargetItems[name]) qtyTargetItems[name] = 1;
        const qty = qtyTargetItems[name];

        const div = document.createElement('div');
        div.className = 'qty-item-card';
        div.innerHTML = `
          <b style="flex:1;">${name}</b>
          <input type="number" value="${qty}" min="1" style="width:70px;" oninput="updateQtyTargetItem('${name}', this.value)"> 개
          <button onclick="removeSearchItem('${name}')" style="color:red; cursor:pointer; border:none; background:none; font-weight:bold;">X</button>
        `;
        container.appendChild(div);
      });

      calculateMultiQuantity();
    }

    /* 하위재료 개별 토글 조작 시 즉시 계산 및 상단 라디오 상태 동기화 */
    function toggleItemExpand(itemName, checked) {
      if (checked) {
        expandedCraftItems.add(itemName);
      } else {
        expandedCraftItems.delete(itemName);
      }
      syncRadioStateWithExpandedItems();
      calculateMultiQuantity();
    }

    /* 조회 방식 라디오 변경 시 분해 모드 업데이트 */
    function onModeRadioChange(mode) {
      currentDecomposeMode = mode;
      expandedCraftItems.clear();

      if (mode === 'flat') {
        // 모든 제작품을 개별 분해 세트에 등록
        recipes.forEach(r => {
          expandedCraftItems.add(getItemName(r));
        });
      } else if (mode === 'buyFollow') {
        // 구매가 추종이 설정되어 있지 않은 제작품만 분해 세트에 등록
        recipes.forEach(r => {
          const name = getItemName(r);
          const hasBuyPrice = !!priceStore[name]?.useBuyPrice;
          if (!hasBuyPrice) {
            expandedCraftItems.add(name);
          }
        });
      }
      // 'default' 시 expandedCraftItems는 클리어 상태 유지
      calculateMultiQuantity();
    }

    /* 현재 결과에 표시된 모든 하위 제작품의 분해 상태 동기화 검사 */
    function syncRadioStateWithExpandedItems() {
      let currentCraftableSubItems = new Set();
      
      function collectCraftables(itemName, isRoot) {
        const recipe = recipes.find(r => getItemName(r) === itemName);
        if (!recipe) return;
        if (!isRoot) currentCraftableSubItems.add(itemName);
        (recipe.ingredients || []).forEach(ing => collectCraftables(getItemName(ing), false));
      }

      selectedSearchItems.forEach(tName => collectCraftables(tName, true));

      if (currentCraftableSubItems.size === 0) return;

      let expandedCount = 0;
      currentCraftableSubItems.forEach(item => {
        if (expandedCraftItems.has(item)) expandedCount++;
      });

      const modeDefaultRadio = document.getElementById('modeDefault');
      const modeFlatRadio = document.getElementById('modeFlat');
      const modeBuyFollowRadio = document.getElementById('modeBuyFollow');

      if (expandedCount === currentCraftableSubItems.size) {
        currentDecomposeMode = 'flat';
        if (modeFlatRadio) modeFlatRadio.checked = true;
      } else if (expandedCount === 0) {
        currentDecomposeMode = 'default';
        if (modeDefaultRadio) modeDefaultRadio.checked = true;
      } else {
        currentDecomposeMode = 'custom';
        if (modeDefaultRadio) modeDefaultRadio.checked = false;
        if (modeFlatRadio) modeFlatRadio.checked = false;
        if (modeBuyFollowRadio) modeBuyFollowRadio.checked = false;
      }
    }

    function calculateMultiQuantity() {
      const resultDiv = document.getElementById('quantityResult');
      if (!resultDiv) return;

      if (selectedSearchItems.size === 0) {
        resultDiv.innerHTML = '선택된 검색 품목이 없습니다. 상단 검색창에서 품목을 검색해 추가해 주세요.';
        return;
      }

      let requiredMaterials = {};
      let leftoverMaterials = {};

      function processCraft(itemName, neededAmount, isRootTarget) {
        const recipe = recipes.find(r => getItemName(r) === itemName);
        const shouldExpand = expandedCraftItems.has(itemName);

        if (!recipe) {
          if (!isRootTarget) {
            requiredMaterials[itemName] = (requiredMaterials[itemName] || 0) + neededAmount;
          }
          return;
        }

        if (isRootTarget) {
          const minCraft = getItemCraftCount(recipe);
          const craftBatches = Math.ceil(neededAmount / minCraft);
          const leftover = (craftBatches * minCraft) - neededAmount;

          if (leftover > 0) leftoverMaterials[itemName] = (leftoverMaterials[itemName] || 0) + leftover;

          (recipe.ingredients || []).forEach(ing => {
            processCraft(getItemName(ing), getIngCount(ing) * craftBatches, false);
          });
          return;
        }

        if (!shouldExpand) {
          requiredMaterials[itemName] = (requiredMaterials[itemName] || 0) + neededAmount;
          return;
        }

        const minCraft = getItemCraftCount(recipe);
        const craftBatches = Math.ceil(neededAmount / minCraft);
        const leftover = (craftBatches * minCraft) - neededAmount;

        if (leftover > 0) leftoverMaterials[itemName] = (leftoverMaterials[itemName] || 0) + leftover;

        (recipe.ingredients || []).forEach(ing => {
          processCraft(getItemName(ing), getIngCount(ing) * craftBatches, false);
        });
      }

      selectedSearchItems.forEach(tName => {
        const qty = qtyTargetItems[tName] || 1;
        processCraft(tName, qty, true);
      });

      let totalCraftCostSum = 0;
      let totalBuyPriceSum = 0;

      selectedSearchItems.forEach(tName => {
        const qty = qtyTargetItems[tName] || 1;
        const effPrice = getEffectivePrice(tName);
        const buyPrice = priceStore[tName]?.buyPrice || 0;

        totalCraftCostSum += effPrice * qty;
        totalBuyPriceSum += buyPrice * qty;
      });

      // 정렬 조건 적용 (검색 연관 우선 -> 트리 깊이 순 -> 즐겨찾기) *이름 정렬 제외*
      let targetSearchSet = new Set();
      selectedSearchItems.forEach(item => {
        getAllSubIngredients(item).forEach(sub => targetSearchSet.add(sub));
      });
      const depthMap = getItemDepthMap([...selectedSearchItems]);

      const sortedMaterials = Object.keys(requiredMaterials).sort((aName, bName) => {
        const aInSearch = targetSearchSet.has(aName) ? 1 : 0;
        const bInSearch = targetSearchSet.has(bName) ? 1 : 0;
        if (aInSearch !== bInSearch) return bInSearch - aInSearch;

        const aDepth = depthMap.has(aName) ? depthMap.get(aName) : 999;
        const bDepth = depthMap.has(bName) ? depthMap.get(bName) : 999;
        if (aDepth !== bDepth) return aDepth - bDepth;

        const aFav = favorites.has(aName) ? 1 : 0;
        const bFav = favorites.has(bName) ? 1 : 0;
        return bFav - aFav;
      });

      let html = `<h4>[다중 목표 제작 필요 목록 및 예상 비용 합산]</h4><b>합산 필요 재료 목록:</b><ul style="line-height: 1.8;">`;
      for (const mat of sortedMaterials) {
        const qty = requiredMaterials[mat];
        const isCrafted = recipes.some(r => getItemName(r) === mat);
        const effPrice = getEffectivePrice(mat);
        const buyPrice = priceStore[mat]?.buyPrice || 0;

        const itemCraftTotal = effPrice * qty;
        const itemBuyTotal = buyPrice * qty;

        const isExpanded = expandedCraftItems.has(mat);

        html += `
          <li>
            <span class="badge ${isCrafted ? 'badge-crafted' : 'badge-simple'}">${isCrafted ? '제작품' : '기본재료'}</span> 
            <b>${mat}</b>: ${qty.toLocaleString()}개 
            ${isCrafted ? `
              <label style="margin-left:8px; font-size:0.85em; cursor:pointer; color:#d32f2f;">
                <input type="checkbox" ${isExpanded ? 'checked' : ''} onchange="toggleItemExpand('${mat}', this.checked)"> 하위재료 분해
              </label>
            ` : ''}
            <small style="color:#555; margin-left:6px;">(적용단가: ${formatCurrency(itemCraftTotal)} ${buyPrice > 0 ? `/ 구매비: ${formatCurrency(itemBuyTotal)}` : ''})</small>
          </li>
        `;
      }
      html += `</ul>`;

      if (Object.keys(leftoverMaterials).length > 0) {
        html += `<b style="color: #2e7d32;">제작 후 남는 부산물:</b><ul>`;
        for (const [mat, qty] of Object.entries(leftoverMaterials)) {
          html += `<li><b>${mat}</b>: ${qty.toLocaleString()}개 남음</li>`;
        }
        html += `</ul>`;
      }

      html += `
        <div style="margin-top: 15px; padding-top: 10px; border-top: 2px dashed #007bff; font-size: 1.05em;">
          <b>💰 예상 총 제작 비용:</b> <span style="color:#d32f2f; font-weight:bold;">${formatCurrency(totalCraftCostSum)}</span><br>
          ${totalBuyPriceSum > 0 ? `<b>🏷 예상 총 구매 비용:</b> <span style="color:#1976d2; font-weight:bold;">${formatCurrency(totalBuyPriceSum)}</span>` : ''}
        </div>
      `;

      resultDiv.innerHTML = html;
    }

    /* 로컬스토리지 저장 및 불러오기 확장 */
    function saveToLocalStorage(isSilent = false) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(priceStore));
      localStorage.setItem(SEARCH_STORAGE_KEY, JSON.stringify({
        selectedItems: [...selectedSearchItems],
        qtyTargets: qtyTargetItems
      }));
      if (!isSilent) showToast('가격 및 검색 데이터가 저장되었습니다.');
    }

    function loadLocalStorage() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) { try { priceStore = JSON.parse(data); } catch (e) {} }

      const favs = localStorage.getItem(FAV_STORAGE_KEY);
      if (favs) { try { favorites = new Set(JSON.parse(favs)); } catch (e) {} }

      const searchData = localStorage.getItem(SEARCH_STORAGE_KEY);
      if (searchData) {
        try {
          const parsed = JSON.parse(searchData);
          if (Array.isArray(parsed.selectedItems)) {
            selectedSearchItems = new Set(parsed.selectedItems);
          }
          if (parsed.qtyTargets && typeof parsed.qtyTargets === 'object') {
            qtyTargetItems = parsed.qtyTargets;
          }
        } catch (e) {}
      }
    }

    function clearLocalStorage() {
      if (confirm('저장된 가격, 즐겨찾기 및 검색 항목 정보를 초기화하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(FAV_STORAGE_KEY);
        localStorage.removeItem(SEARCH_STORAGE_KEY);
        localStorage.removeItem(TAB_STORAGE_KEY);
        priceStore = {};
        favorites.clear();
        selectedSearchItems.clear();
        qtyTargetItems = {};
        expandedCraftItems.clear();
        renderAllSearchTags();
        initPriceStore();
        renderCostTable();
        renderQtyTargetRows();
        showToast('정보가 초기화되었습니다.', 'warn');
      }
    }
  </script>
</body>
</html>
