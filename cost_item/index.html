<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제작도감 비용 및 수량 계산기</title>
  <script src="recipes.js" defer></script>
  <style>
    :root {
      --bg-simple: #e8f5e9;
      --bg-crafted: #fffde7;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 { margin-bottom: 10px; }

    .control-panel {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .tab-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn {
      padding: 10px 20px;
      border: 1px solid #ccc;
      background: #e0e0e0;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px 5px 0 0;
    }
    .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }
    
    .tab-content {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 0 5px 5px 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tab-content.active { display: block; }
    
    /* 카테고리 필터 버튼 */
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .filter-btn {
      padding: 6px 12px;
      border: 1px solid #007bff;
      background: #fff;
      color: #007bff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
    }
    .filter-btn.active { background: #007bff; color: white; }

    /* 즐겨찾기 별 버튼 */
    .star-btn { cursor: pointer; color: #ccc; font-size: 1.2em; user-select: none; margin-right: 4px; }
    .star-btn.active { color: #fbc02d; }

    /* 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    
    .bg-simple { background-color: var(--bg-simple) !important; }
    .bg-crafted { background-color: var(--bg-crafted) !important; }

    input[type="number"] { padding: 6px; width: 110px; border: 1px solid #ccc; border-radius: 4px; }
    .sub-table { margin-top: 8px; background: #fafafa; }
    
    .badge { display: inline-block; padding: 3px 7px; font-size: 0.8em; border-radius: 3px; font-weight: bold; }
    .badge-simple { background: #c8e6c9; color: #2e7d32; }
    .badge-crafted { background: #fff9c4; color: #f57f17; }
    
    .price-type-toggle { font-size: 0.85em; margin-top: 4px; }
    .result-box { margin-top: 20px; padding: 15px; background: #eef7ff; border-left: 5px solid #007bff; }

    /* 토스트 스타일 */
    #toastContainer { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 200px; padding: 12px 20px; background: #323232; color: #fff; border-radius: 6px; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-success { background: #2e7d32; }
    .toast-info { background: #2196f3; }
    .toast-warn { background: #f57c00; }
  </style>
</head>
<body>

  <h1>제작도감 계산기</h1>

  <div class="control-panel">
    <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
      <label><input type="checkbox" id="autoSaveToggle"> 변경사항 자동 저장</label>
      <button onclick="saveToLocalStorage()" style="padding: 6px 12px; cursor: pointer;">저장</button>
      <button onclick="clearLocalStorage()" style="padding: 6px 12px; cursor: pointer;">데이터 초기화</button>
    </div>
  </div>

  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('costTab', this)">제작 비용</button>
    <button class="tab-btn" onclick="switchTab('quantityTab', this)">제작 수량</button>
  </div>

  <!-- 탭 1: 제작 비용 -->
  <div id="costTab" class="tab-content active">
    <h3>주요 품목 제작 비용 계산 (단위: 만냥)</h3>
    <div style="margin-bottom: 6px;">
      <label style="font-size:0.9em; font-weight:bold; color:#555;">카테고리 필터 (중복 선택 가능):</label>
    </div>
    <div id="categoryFilterContainer" class="filter-group"></div>

    <table id="costTable">
      <thead>
        <tr>
          <th>품목명 (★ 즐겨찾기)</th>
          <th>1회 제작수량</th>
          <th>필요 재료 및 가격</th>
          <th>1회 총 제작비용</th>
          <th>개당 제작비용</th>
          <th>개당 구매가격</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 탭 2: 제작 수량 (다중 선택) -->
  <div id="quantityTab" class="tab-content">
    <h3>제작 필요 재료 산출 (다중 항목 합산)</h3>
    <div style="margin-bottom: 15px;">
      <div id="targetItemsContainer"></div>
      <button onclick="addTargetItemRow()" style="margin-top: 5px; padding: 6px 12px; cursor: pointer;">+ 품목 추가</button>
      
      <div style="margin-top: 15px;">
        <label style="font-weight: bold; color: #d32f2f; cursor: pointer;">
          <input type="checkbox" id="flatMaterialsToggle" onchange="calculateMultiQuantity()"> 최하위 재료 갯수로만 보기
        </label>
      </div>
    </div>

    <div id="quantityResult" class="result-box"></div>
  </div>

  <div id="toastContainer"></div>

  <script>
    let recipes = [];
    let priceStore = {};
    let favorites = new Set();
    let selectedJobs = new Set();
    let autoSave = false;

    const STORAGE_KEY = 'craft_calculator_prices_v6';
    const FAV_STORAGE_KEY = 'craft_calculator_favs_v6';

    function showToast(message, type = 'success', duration = 2500) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => container.contains(toast) && container.removeChild(toast), 300);
      }, duration);
    }

    function getItemName(item) {
      return item?.item_name || item?.name || item?.itemName || '이름없음';
    }

    function getItemCraftCount(item) {
      const raw = item?.yield ?? item?.crafting_yield ?? item?.craftCount ?? item?.count ?? 1;
      return parseFloat(raw) || 1;
    }

    function getIngCount(ing) {
      const raw = ing?.quantity ?? ing?.count ?? ing?.amount ?? 1;
      return parseFloat(raw) || 1;
    }

    function getItemFee(item) {
      const raw = item?.crafting_fee ?? item?.fee ?? 0;
      if (typeof raw === 'number') return raw >= 1000 ? raw / 10000 : raw;
      const match = String(raw).replace(/,/g, '').match(/([\d.]+)\s*([만천])?/);
      if (!match) return 0;
      const num = parseFloat(match[1]);
      return match[2] === '만' ? num : match[2] === '천' ? num * 0.1 : (num >= 1000 ? num / 10000 : num);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();

      if (typeof defaultRecipes !== 'undefined' && Array.isArray(defaultRecipes)) {
        recipes = defaultRecipes;
        initPriceStore();
        renderCategoryFilters();
        renderCostTable();
        addTargetItemRow();
      } else {
        showToast('recipes.js 데이터 로드에 실패했습니다.', 'warn', 4000);
      }

      document.getElementById('autoSaveToggle').addEventListener('change', (e) => {
        autoSave = e.target.checked;
        if (autoSave) showToast('자동 저장이 활성화되었습니다.', 'info');
      });
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    /* 1. 카테고리(job) 다중 필터 */
    function renderCategoryFilters() {
      const container = document.getElementById('categoryFilterContainer');
      if (!container) return;
      
      const jobs = [...new Set(recipes.map(r => r.job).filter(Boolean))];
      container.innerHTML = '';

      jobs.forEach(job => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${selectedJobs.has(job) ? 'active' : ''}`;
        btn.textContent = job;
        btn.onclick = () => {
          if (selectedJobs.has(job)) {
            selectedJobs.delete(job);
            btn.classList.remove('active');
          } else {
            selectedJobs.add(job);
            btn.classList.add('active');
          }
          renderCostTable();
        };
        container.appendChild(btn);
      });
    }

    /* 2. 즐겨찾기 토글 (상단 고정 정렬) */
    function toggleFavorite(itemName) {
      if (favorites.has(itemName)) {
        favorites.delete(itemName);
      } else {
        favorites.add(itemName);
      }
      localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify([...favorites]));
      renderCostTable();
    }

    function initPriceStore() {
      recipes.forEach(r => {
        const name = getItemName(r);
        if (!priceStore[name]) priceStore[name] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
        (r.ingredients || []).forEach(ing => {
          const ingName = getItemName(ing);
          if (!priceStore[ingName]) priceStore[ingName] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
        });
      });
    }

    function updatePrice(itemName, field, value) {
      if (!priceStore[itemName]) priceStore[itemName] = { basePrice: 0, buyPrice: 0, useBuyPrice: false };
      if (field === 'useBuyPrice') {
        priceStore[itemName].useBuyPrice = value;
        renderCostTable();
      } else {
        priceStore[itemName][field] = parseFloat(value) || 0;
        updateCalculatedUI();
      }
      if (autoSave) saveToLocalStorage(true);
    }

    function getEffectivePrice(itemName) {
      const itemData = priceStore[itemName];
      if (!itemData) return 0;
      if (itemData.useBuyPrice) return itemData.buyPrice;

      const recipe = recipes.find(r => getItemName(r) === itemName);
      if (recipe) {
        let totalCost = getItemFee(recipe);
        const minCraft = getItemCraftCount(recipe);
        (recipe.ingredients || []).forEach(ing => {
          totalCost += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        return minCraft > 0 ? (totalCost / minCraft) : 0;
      }
      return itemData.basePrice;
    }

    function updateCalculatedUI() {
      document.querySelectorAll('[data-applied-price]').forEach(el => {
        const ingName = el.getAttribute('data-applied-price');
        el.textContent = `적용가: ${Number(getEffectivePrice(ingName).toFixed(4)).toLocaleString()}만냥`;
      });

      recipes.filter(r => r.isMainItem !== false).forEach(item => {
        const name = getItemName(item);
        const minCraft = getItemCraftCount(item);
        let craftCostPerBatch = getItemFee(item);
        (item.ingredients || []).forEach(ing => {
          craftCostPerBatch += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        const unitCraftCost = minCraft > 0 ? craftCostPerBatch / minCraft : 0;
        if (priceStore[name]) priceStore[name].basePrice = unitCraftCost;

        const safeId = encodeURIComponent(name);
        const totalCell = document.getElementById(`total-cost-${safeId}`);
        const unitCell = document.getElementById(`unit-cost-${safeId}`);
        if (totalCell) totalCell.textContent = `${Number(craftCostPerBatch.toFixed(4)).toLocaleString()} 만냥`;
        if (unitCell) unitCell.innerHTML = `<b>${Number(unitCraftCost.toFixed(4)).toLocaleString()} 만냥</b>`;
      });
    }

    function renderCostTable() {
      const tbody = document.querySelector('#costTable tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      let filtered = recipes.filter(r => r.isMainItem !== false);
      if (selectedJobs.size > 0) {
        filtered = filtered.filter(r => selectedJobs.has(r.job));
      }

      filtered.sort((a, b) => {
        const aFav = favorites.has(getItemName(a)) ? 1 : 0;
        const bFav = favorites.has(getItemName(b)) ? 1 : 0;
        return bFav - aFav;
      });

      filtered.forEach(item => {
        const name = getItemName(item);
        const minCraft = getItemCraftCount(item);
        const fee = getItemFee(item);
        const safeId = encodeURIComponent(name);
        const isFav = favorites.has(name);
        const tr = document.createElement('tr');
        
        let craftCostPerBatch = fee;
        (item.ingredients || []).forEach(ing => {
          craftCostPerBatch += getEffectivePrice(getItemName(ing)) * getIngCount(ing);
        });
        const unitCraftCost = minCraft > 0 ? craftCostPerBatch / minCraft : 0;
        if (priceStore[name]) priceStore[name].basePrice = unitCraftCost;

        const storeData = priceStore[name] || { buyPrice: 0, useBuyPrice: false };

        let ingRows = (item.ingredients || []).map(ing => {
          const ingName = getItemName(ing);
          const ingCount = getIngCount(ing);
          const isCrafted = recipes.some(r => getItemName(r) === ingName);
          const ingPrice = getEffectivePrice(ingName);
          const ingStore = priceStore[ingName] || { buyPrice: 0, useBuyPrice: false };

          return `
            <tr class="${isCrafted ? 'bg-crafted' : 'bg-simple'}">
              <td>
                <span class="badge ${isCrafted ? 'badge-crafted' : 'badge-simple'}">${isCrafted ? '제작' : '재료'}</span>
                <b>${ingName}</b> (${ingCount}개)
              </td>
              <td>
                ${isCrafted ? `
                  <span data-applied-price="${ingName}">적용가: ${Number(ingPrice.toFixed(4)).toLocaleString()}만냥</span>
                  <div class="price-type-toggle">
                    <label><input type="checkbox" ${ingStore.useBuyPrice ? 'checked' : ''} onchange="updatePrice('${ingName}', 'useBuyPrice', this.checked)"> 구매가 추종</label>
                  </div>
                ` : `
                  <input type="number" step="any" value="${ingStore.basePrice || ''}" placeholder="가격 입력" oninput="updatePrice('${ingName}', 'basePrice', this.value)"> 만냥
                `}
                ${ingStore.useBuyPrice ? `<br><input type="number" step="any" style="margin-top:4px;" value="${ingStore.buyPrice || ''}" placeholder="구매가 입력" oninput="updatePrice('${ingName}', 'buyPrice', this.value)"> 만냥` : ''}
              </td>
            </tr>
          `;
        }).join('');

        tr.innerHTML = `
          <td class="bg-crafted">
            <span class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${name}')">★</span>
            <b>${name}</b>
            ${item.job ? `<br><small style="color:#666;">[${item.job}]</small>` : ''}
          </td>
          <td><b>${minCraft}개</b></td>
          <td><table class="sub-table" style="width:100%;">${ingRows}</table></td>
          <td id="total-cost-${safeId}">${Number(craftCostPerBatch.toFixed(4)).toLocaleString()} 만냥</td>
          <td id="unit-cost-${safeId}"><b>${Number(unitCraftCost.toFixed(4)).toLocaleString()} 만냥</b></td>
          <td>
            <input type="number" step="any" value="${storeData.buyPrice || ''}" placeholder="구매가격" ${!storeData.useBuyPrice ? 'disabled' : ''} oninput="updatePrice('${name}', 'buyPrice', this.value)"> 만냥
            <div class="price-type-toggle">
              <label><input type="checkbox" ${storeData.useBuyPrice ? 'checked' : ''} onchange="updatePrice('${name}', 'useBuyPrice', this.checked)"> 구매가 추종</label>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* 3. 다중 수량 추가 및 계산 */
    function addTargetItemRow() {
      const container = document.getElementById('targetItemsContainer');
      if (!container) return;

      const div = document.createElement('div');
      div.className = 'target-item-row';
      div.style.cssText = 'display:flex; gap:10px; margin-bottom:8px; align-items:center;';

      let options = recipes.map(r => `<option value="${getItemName(r)}">${getItemName(r)}</option>`).join('');

      div.innerHTML = `
        <select class="target-select" onchange="calculateMultiQuantity()">${options}</select>
        <input type="number" class="target-qty" value="1" min="1" style="width:80px;" oninput="calculateMultiQuantity()"> 개
        <button onclick="this.parentElement.remove(); calculateMultiQuantity();" style="color:red; cursor:pointer;">X</button>
      `;
      container.appendChild(div);
      calculateMultiQuantity();
    }

    function calculateMultiQuantity() {
      const rows = document.querySelectorAll('.target-item-row');
      const isFlat = document.getElementById('flatMaterialsToggle')?.checked || false;
      const resultDiv = document.getElementById('quantityResult');
      if (!resultDiv) return;

      let targetMap = {};
      rows.forEach(row => {
        const name = row.querySelector('.target-select').value;
        const qty = parseInt(row.querySelector('.target-qty').value) || 0;
        if (name && qty > 0) targetMap[name] = (targetMap[name] || 0) + qty;
      });

      let requiredMaterials = {};
      let leftoverMaterials = {};

      function processCraft(itemName, neededAmount, originTarget) {
        const recipe = recipes.find(r => getItemName(r) === itemName);
        if (!recipe) {
          requiredMaterials[itemName] = (requiredMaterials[itemName] || 0) + neededAmount;
          return;
        }
        if (!isFlat && itemName !== originTarget) {
          requiredMaterials[itemName] = (requiredMaterials[itemName] || 0) + neededAmount;
          return;
        }
        const minCraft = getItemCraftCount(recipe);
        const craftBatches = Math.ceil(neededAmount / minCraft);
        const leftover = (craftBatches * minCraft) - neededAmount;

        if (leftover > 0) leftoverMaterials[itemName] = (leftoverMaterials[itemName] || 0) + leftover;

        (recipe.ingredients || []).forEach(ing => {
          processCraft(getItemName(ing), getIngCount(ing) * craftBatches, originTarget);
        });
      }

      for (const [tName, tQty] of Object.entries(targetMap)) {
        processCraft(tName, tQty, tName);
      }

      let html = `<h4>[다중 목표 제작 필요 목록 합산]</h4><b>합산 필요 재료:</b><ul>`;
      for (const [mat, qty] of Object.entries(requiredMaterials)) {
        const isCrafted = recipes.some(r => getItemName(r) === mat);
        html += `<li><span class="badge ${isCrafted ? 'badge-crafted' : 'badge-simple'}">${isCrafted ? '제작품' : '기본재료'}</span> <b>${mat}</b>: ${qty.toLocaleString()}개</li>`;
      }
      html += `</ul>`;

      if (Object.keys(leftoverMaterials).length > 0) {
        html += `<b style="color: #2e7d32;">제작 후 남는 부산물:</b><ul>`;
        for (const [mat, qty] of Object.entries(leftoverMaterials)) {
          html += `<li><b>${mat}</b>: ${qty.toLocaleString()}개 남음</li>`;
        }
        html += `</ul>`;
      }
      resultDiv.innerHTML = html;
    }

    function saveToLocalStorage(isSilent = false) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(priceStore));
      if (!isSilent) showToast('가격 데이터가 저장되었습니다.');
    }

    function loadLocalStorage() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) { try { priceStore = JSON.parse(data); } catch (e) {} }
      const favs = localStorage.getItem(FAV_STORAGE_KEY);
      if (favs) { try { favorites = new Set(JSON.parse(favs)); } catch (e) {} }
    }

    function clearLocalStorage() {
      if (confirm('저장된 가격 및 즐겨찾기 정보를 초기화하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(FAV_STORAGE_KEY);
        priceStore = {};
        favorites.clear();
        initPriceStore();
        renderCostTable();
        showToast('정보가 초기화되었습니다.', 'warn');
      }
    }
  </script>
</body>
</html>
