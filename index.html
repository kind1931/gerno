<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XT7WN5EW7B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XT7WN5EW7B');
  </script>

  <!-- 공통 네비게이션 스크립트 -->
  <script src="/nav.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거상 계산기 모음</title>

  <script>
    // 대문 페이지를 유지하려면 아래 값을 "" 로 비워둡니다.
    // 특정 계산기로 자동 이동시키고 싶을 때만 "/cash/" 형태로 입력하세요.
    const DEFAULT_TARGET = "";

    if (DEFAULT_TARGET && DEFAULT_TARGET.trim() !== "") {
      window.location.replace(DEFAULT_TARGET);
    }
  </script>

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #4dabf7;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --border: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; }

    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 2rem; color: #ffffff; margin-bottom: 8px; }
    .header p { color: var(--text-muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; text-decoration: none; color: inherit; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card h2 { font-size: 1.25rem; color: #ffffff; margin-bottom: 10px; }
    .card p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
    .card-link { font-size: 0.85rem; color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>거상 도우미 계산기</h1>
      <p>원하시는 계산기를 선택해주세요.</p>
    </div>

    <div class="grid">
      <!-- 폴더 구조에 맞춰 경로를 /cash/ 및 /uju/로 수정 -->
      <a href="cash/" class="card">
        <div>
          <h2>💳 추석 캐쉬 할인 계산기</h2>
          <p>추석 이벤트 캐쉬 구매 시 필요 현금, 지전, 재화 가치 및 차익을 자동 계산합니다.</p>
        </div>
        <span class="card-link">바로가기 &rarr;</span>
      </a>

      <a href="uju/" class="card">
        <div>
          <h2>🍾 어주(小) 계산기</h2>
          <p>필요한 어주(小) 개수와 가격에 따른 필요 경험치, 거래 횟수, 총 비용을 계산합니다.</p>
        </div>
        <span class="card-link">바로가기 &rarr;</span>
      </a>
    </div>
  </div>

</body>
</html>
